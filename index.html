<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Copa del Comedor</title>


  <!-- =====================================
       CONFIGURACIÓN PWA
       ===================================== -->

  <meta
    name="theme-color"
    content="#0b1231"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Copa Comedor"
  >


  <!-- =====================================
       MANIFEST
       ===================================== -->

  <link
    rel="manifest"
    href="./manifest.json"
  >


  <!-- =====================================
       ICONOS
       ===================================== -->

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./copa_comedor_180.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./copa_comedor_192.png"
  >


  <!-- =====================================
       ESTILOS
       ===================================== -->

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      min-height: 100dvh;

      overflow: hidden;

      background: #061329;

    }


    body {

      position: fixed;
      inset: 0;

    }


    iframe {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #061329;

    }

  </style>

</head>


<body>


  <!-- =====================================
       APLICACIÓN DE GOOGLE APPS SCRIPT
       ===================================== -->

  <iframe

    src="https://script.google.com/macros/s/AKfycbxy8J1QvL6SCnhYR_dUOZQE9Y6_17SFuYqiSYjWXi3rWGLmAi69xf8o0kf0bsRLzsY/exec"

    title="Copa del Comedor"

    allow="fullscreen"

    allowfullscreen

  ></iframe>


  <!-- =====================================
       SERVICE WORKER
       ===================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "./service-worker.js"
            )
            .then(
              function(registro) {

                console.log(
                  "Service Worker registrado correctamente:",
                  registro.scope
                );

              }
            )
            .catch(
              function(error) {

                console.error(
                  "Error al registrar el Service Worker:",
                  error
                );

              }
            );

        }
      );

    }

  </script>


</body>

</html>
